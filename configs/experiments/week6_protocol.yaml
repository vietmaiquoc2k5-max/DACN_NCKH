# WEEK 6 EXPERIMENT PROTOCOL SPECIFICATION
# Project: DACN_NCKH - Early Fire and Smoke Detection from Surveillance Cameras
# Phase: Week 6 Infrastructure & Ablation Design

protocol_version: "week6_v1_ablation_and_deployment"
status: "ACTIVE"

# Operating Point Designation
operating_point:
  status: "PROVISIONAL"
  lock_status: "UNLOCKED"
  reason: "24 of 35 Ground Truth events are pending second annotator cross-verification; 0 validation positive videos are verified."
  provisional_parameters:
    confidence: 0.35
    k: 3
    n: 8
    feature_threshold: 0.02
    cooldown_sec: 5.0
    merge_gap_sec: 2.0
  policy: "PROVISIONAL operating point CANNOT be promoted to LOCKED until 100% of validation positive GT events are cross-verified."

