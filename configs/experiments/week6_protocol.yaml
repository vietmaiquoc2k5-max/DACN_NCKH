# Detection & Tracking Protocol
inference_parameters:
  imgsz_baseline: 640
  imgsz_ablation: [416, 640, 960]
  conf_baseline: 0.35
  conf_ablation: [0.25, 0.35, 0.50]
  iou_nms: 0.70
  sampling_rate_fps: 5.0
  sampling_mode: "NATIVE_PTS_SAMPLING"

tracker_parameters:
  tracker_type: "bytetrack"
  track_thresh: 0.35
  match_thresh: 0.80
  track_buffer: 30
  frame_rate: 5

temporal_verifier_parameters:
  window_size_n: 8
  confirm_frames_k: 3
  suspect_frames_k: 1
  cooldown_sec: 5.0
  feature_threshold: 0.02
  merge_gap_sec: 2.0
  ablation_k_n:
    - [2, 8]
    - [3, 8]
    - [4, 10]

# Hardware & Environment Specifications
environment:
  python: "3.10.11"
  torch: "2.5.1+cu121"
  cuda: "12.1"
  ultralytics: "8.4.190"
  device: "cuda:0"
  gpu_name: "NVIDIA GeForce RTX 4050 Laptop GPU"
  vram_mb: 6140
  cpu_architecture: "Intel64 Family 6 Model 141 Stepping 1, GenuineIntel"

# Strict Experimental Guards
rules:
  test_split_protection: "Test split (630 frames / 29 videos) is STRICTLY FORBIDDEN for hyperparameter tuning or ablation."
  event_recall_guard: "Event recall and delay cannot be tuned on pending Ground Truth; pending events MUST NOT be treated as verified."
  reproducibility: "All runs must log config SHA256, model SHA256, timestamp, and hardware state."
