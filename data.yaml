# Cấu hình Dataset chính cho YOLOv8
# Hiện đang trỏ tới Dataset tích hợp từ FireSmokeLabeler (3.538 ảnh, 5.521 bboxes)
# Thứ tự class chuẩn: 0: smoke, 1: fire (Đồng bộ với best.pt)
path: FireSmokeLabeler/dataset 

# Đường dẫn đến ảnh train và val (tương đối so với 'path')
train: images/train
val: images/val

# Số lượng lớp và tên lớp
nc: 2
names:
  0: smoke
  1: fire
