name: CI - Test Suite & Video Audit Integrity

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy opencv-python-headless scipy
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Video Audit & Poisson CI Unit Tests
        run: |
          python -m unittest tests/test_video_audit_and_consistency.py tests/test_poisson_ci.py -v

      - name: Run Temporal Verifier & Event Eval Unit Tests
        run: |
          python -m unittest discover tests -p "test_*.py" -v

